<!-- Tile-less variant of the Glide logo for inline use (e.g. the sidebar):
     the vim command line - a `:` prompt and a block cursor.
     The colon uses currentColor so it adapts to the surrounding theme. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <rect x="12" y="20" width="19" height="19" rx="2" fill="currentColor"/>
  <rect x="12" y="58" width="19" height="19" rx="2" fill="currentColor"/>
  <rect x="45" y="17" width="40" height="62" rx="3" fill="#f59e0b"/>
</svg>
