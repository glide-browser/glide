<!-- Tile-less variant of the Glide dart for inline use (e.g. the sidebar);
     the wing uses currentColor so it adapts to the surrounding theme. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <polygon points="90,6 6,50 40,52" fill="currentColor"/>
  <polygon points="90,6 40,52 52,90" fill="#f59e0b"/>
</svg>
