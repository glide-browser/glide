name: Docs

on:
  workflow_dispatch:
    inputs:
      branch:
        type: string
        required: false
        description: branch to deploy to
  push:
    branches:
      - docs-production

jobs:
  deploy:
    name: deploy
    environment: docs

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure git
        run: |
          git config --global \
            url."https://github.com/mozilla-firefox/firefox.git".insteadOf \
            "git@github.com:mozilla-firefox/firefox.git"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          cd infra && pnpm --ignore-workspace install --frozen-lockfile

      - name: Bundle vendored dependencies
        run: pnpm bundle

      - name: Compile TS
        run: pnpm build:ts

      - name: Build docs
        run: pnpm build:docs

      - name: Transform docs
        run: pnpm build:docs:production

      - name: Deploy to Cloudflare
        working-directory: infra
        run: |
          pnpm wrangler pages deploy --cwd=../src/glide/docs \
            dist \
            --project-name=glide \
            --branch="$BRANCH"
        env:
          BRANCH: ${{ inputs.branch || 'main' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # every page is served with `s-maxage=31536000` (see src/glide/docs/_headers) and a
      # deploy doesn't evict what the zone cache already holds, so without this the edge
      # keeps serving the previous deploy's pages
      - name: Purge the Cloudflare cache
        if: ${{ (inputs.branch || 'main') == 'main' }}
        run: |
          : "${CLOUDFLARE_ZONE_ID:?add the CLOUDFLARE_ZONE_ID secret}"

          # let the new deployment reach the edge first, so the old pages don't get cached again
          sleep 15

          response=$(curl -sS --fail-with-body -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}') || { echo "$response"; exit 1; }
          jq -e '.success' <<<"$response" >/dev/null || { echo "$response"; exit 1; }
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
