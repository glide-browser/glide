name: Linux Build

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Only build this architecture (aarch64 or x86_64); empty builds both"
        type: string
        default: ""
      upload:
        description: "Upload built artifacts"
        type: boolean
        default: true
      MOZ_BUILD_DATE:
        type: string
        default: ""
        description: "Set the build id"
  workflow_call:
    inputs:
      upload:
        description: "Used to distinguish dispatch and call events"
        required: true
        type: boolean
      MOZ_BUILD_DATE:
        type: string
        default: ""
        description: "Set the build id"

jobs:
  linux-build:
    name: Build - ${{ matrix.arch }}

    runs-on: ${{ matrix.arch == 'x86_64' && 'depot-ubuntu-24.04-16' || 'depot-ubuntu-24.04-arm-16' }}
    env:
      CARGO_TERM_COLOR: always
      GLIDE_PLATFORM: linux
      GLIDE_RELEASE: true
      # keep the objdir out of engine/ so the Firefox checkout can be cached
      MOZ_OBJDIR: ${{ github.workspace }}/objdir
      # let mach clobber the restored objdir itself when Firefox requires it
      AUTOCLOBBER: 1
      GLIDE_DISABLE_PGO: 1
      GLIDE_COMPAT: ${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arch && format('["{0}"]', inputs.arch) || '["aarch64", "x86_64"]') }}

    defaults:
      run:
        # Every step runs inside the pinned nix environment defined by
        # `devShells.ci` in flake.nix, which provides the complete toolchain
        # (no `mach bootstrap`). Steps that run before nix is installed
        # override this with `shell: bash`.
        shell: nix develop .#ci --profile /tmp/nix-ci-profile --command bash -euo pipefail {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure git
        shell: bash
        run: |
          git config --global \
            url."https://github.com/mozilla-firefox/firefox.git".insteadOf \
            "git@github.com:mozilla-firefox/firefox.git"

      - name: Build id
        shell: bash
        # Without a fixed build id every `mach build` invocation gets a new one,
        # which makes `mach package` relink libxul (a full cross-LTO link on
        # macOS). Release runs pass one in; generate one here otherwise.
        env:
          INPUT_MOZ_BUILD_DATE: ${{ inputs.MOZ_BUILD_DATE }}
        run: |
          echo "MOZ_BUILD_DATE=${INPUT_MOZ_BUILD_DATE:-$(date +%Y%m%d%H%M%S)}" >> "$GITHUB_ENV"

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3.22.5

      - name: Restore nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-v2-${{ runner.os }}-${{ runner.arch }}-
          # only collect garbage before saving if the store grew past this
          gc-max-store-size-linux: 10G

      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Firefox checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # the shallow clone of the pinned Firefox revision (cloning takes
          # 2-3 minutes); `pnpm bootstrap` resets and re-patches it anyway
          path: engine
          key: engine-v3-${{ runner.os }}-${{ hashFiles('firefox.json') }}

      - name: Restore objdir
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # incremental builds: restore the most recent objdir built for this
          # Firefox revision and always save this job's one (unique key).
          # (not done on macOS: saving a cache there runs at ~6 MB/s)
          path: objdir
          key: objdir-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firefox.json') }}-${{ github.run_id }}
          restore-keys: |
            objdir-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firefox.json') }}-

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          disable_annotations: true

      - name: Expose actions cache variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6.4.1
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])

      - name: Nix environment
        run: |
          nix --version
          clang --version
          rustc --version
          cargo --version
          node --version
          pnpm --version
          python3 --version
          df -h .
          echo "$GLIDE_MOZCONFIG_CONTENT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap repo
        run: |
          pnpm bootstrap

      - name: Build
        run: |
          pnpm build

      - name: sccache stats
        shell: bash
        run: sccache --show-stats || true

      - name: Package
        run: |
          pnpm package

      - name: Rename artifacts
        run: |
          mv dist/glide-*.tar.xz "dist/glide.linux-$GLIDE_COMPAT.tar.xz"

      - name: Upload tar
        if: inputs.upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 10
          name: glide.linux-${{ matrix.arch }}.tar.xz
          path: ./dist/glide.linux-${{ matrix.arch }}.tar.xz
