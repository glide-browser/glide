name: macOS Build

on:
  workflow_dispatch:
    inputs:
      artifacts:
        description: "Upload built artifacts"
        type: boolean
        default: true
      MOZ_BUILD_DATE:
        type: string
        default: ""
        description: "Set the build id"
      # TEMPORARY, see the `signed-mar-test` job
      signed_mar_test:
        description: "TEMPORARY: rehearse the signed update MAR pipeline with the build's artifacts"
        type: boolean
        default: false
      signed_mar_test_run_id:
        description: "TEMPORARY: rehearse with the artifacts of this run id instead of building"
        type: string
        default: ""
      signed_mar_test_skip:
        description: "TEMPORARY: rehearsal phases to skip, e.g. b,c"
        type: string
        default: ""
  workflow_call:
    inputs:
      artifacts:
        description: "Used to distinguish dispatch and call events"
        required: true
        type: boolean
      MOZ_BUILD_DATE:
        type: string
        default: ""
        description: "Set the build id"

jobs:
  macos-build:
    name: Build - ${{ matrix.arch }}
    # TEMPORARY condition, see the `signed-mar-test` job
    if: ${{ !inputs.signed_mar_test_run_id }}

    runs-on: depot-macos-26
    env:
      CARGO_TERM_COLOR: always
      GLIDE_PLATFORM: macos
      GLIDE_RELEASE: true
      GLIDE_LTO: 1
      GLIDE_DISABLE_PGO: 1
      GLIDE_COMPAT: ${{ matrix.arch }}
      MOZ_BUILD_DATE: ${{ inputs.MOZ_BUILD_DATE }}

    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]

    steps:
      - name: Debug
        run: |
          xcrun --show-sdk-version

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure git
        run: |
          git config --global \
            url."https://github.com/mozilla-firefox/firefox.git".insteadOf \
            "git@github.com:mozilla-firefox/firefox.git"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          disable_annotations: true

      - name: Expose actions cache variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6.4.1
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])

      - name: Install system dependencies
        run: |
          brew update
          brew install cairo gnu-tar mercurial

          brew uninstall --ignore-dependencies python3.12 -f

          export PATH="$(python3 -m site --user-base)/bin":$PATH

          rm '/usr/local/bin/2to3-3.11' '/usr/local/bin/2to3-3.12' '/usr/local/bin/2to3' || true
          rm '/usr/local/bin/idle3.11' '/usr/local/bin/idle3.12' '/usr/local/bin/idle3' || true
          rm '/usr/local/bin/pydoc3.11' '/usr/local/bin/pydoc3.12' '/usr/local/bin/pydoc3' || true
          rm '/usr/local/bin/python3.11' '/usr/local/bin/python3.12' '/usr/local/bin/python3' || true
          rm '/usr/local/bin/python3.11-config' '/usr/local/bin/python3.12-config' '/usr/local/bin/python3-config' || true

          brew install watchman

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95
          source $HOME/.cargo/env

          cargo install cbindgen

          if test "$GLIDE_COMPAT" = "aarch64"; then
            rustup target add aarch64-apple-darwin
          else
            rustup target add x86_64-apple-darwin
            brew install nasm
          fi

      # mach doesn't support Python 3.15 yet: with brew's 3.15 the taskgraph venv fails
      # to install, so `mach bootstrap` silently skips the clang toolchain.
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap repo
        run: |
          pnpm bootstrap

      - name: Bootstrap system
        working-directory: engine
        run: |
          export PATH="$(python3 -m site --user-base)/bin":$PATH
          ./mach --verbose --no-interactive bootstrap --application-choice browser --no-system-changes --exclude MacOSX26.4.sdk || true
          test -x "$HOME/.mozbuild/clang/bin/clang" || { echo "::error::mach bootstrap did not install clang"; exit 1; }

      - name: Download WASI SDK
        run: |
          mkdir -p "$HOME/.mozbuild/wasi-sdk"
          curl -L "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-arm64-macos.tar.gz" \
            | tar -xz -C "$HOME/.mozbuild/wasi-sdk" --strip-components=1
          echo "WASI_SYSROOT=$HOME/.mozbuild/wasi-sdk/share/wasi-sysroot" >> $GITHUB_ENV

      - name: Build
        run: |
          pnpm build

      - name: Package
        run: |
          pnpm package

      - name: Rename artifacts
        run: |
          mv dist/glide-*.dmg "dist/glide.macos-$GLIDE_COMPAT.dmg"
          mv dist/output.mar "dist/macos-$GLIDE_COMPAT.mar"
          # the sign workflow needs this to re-create the MAR from the signed .app
          cp engine/obj-*/dist/host/bin/mar dist/mar

      - name: Upload DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 10
          name: glide.macos-${{ matrix.arch }}.dmg
          path: ./dist/glide.macos-${{ matrix.arch }}.dmg

      - name: Upload MAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 10
          name: macos-${{ matrix.arch }}.mar
          path: ./dist/macos-${{ matrix.arch }}.mar

      - name: Upload MAR tool
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 10
          name: macos-${{ matrix.arch }}-mar-tool
          path: ./dist/mar
          if-no-files-found: error

      - name: Upload browser upload manifests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 10
          name: macos-${{ matrix.arch }}-updates
          path: ./dist/update/

  # TEMPORARY: the GitHub hosted macOS runners have System Integrity Protection disabled, so
  # they can't show everything a user's Mac does when an app bundle is modified. Are the depot
  # runners any different? Takes a few seconds.
  sip-probe:
    name: SIP probe
    if: ${{ inputs.signed_mar_test }}
    runs-on: depot-macos-26
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Probe
        run: |
          sw_vers
          uname -m
          csrutil status || true
          spctl --status || true

  # TEMPORARY rehearsal for `fix/macos-signed-update-mar`, do not merge.
  #
  # The sign job only runs during a release, so this runs the same steps as macos-sign.yml
  # against the build's artifacts, with a throwaway certificate instead of the Apple credentials.
  signed-mar-test:
    name: Signed MAR rehearsal - ${{ matrix.arch }}
    needs: [macos-build]
    if: ${{ inputs.signed_mar_test && !cancelled() }}
    runs-on: "macos-15"
    env:
      GLIDE_COMPAT: ${{ matrix.arch }}
      ARTIFACTS_RUN_ID: ${{ inputs.signed_mar_test_run_id || github.run_id }}

    timeout-minutes: 100
    permissions:
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure git
        run: |
          git config --global \
            url."https://github.com/mozilla-firefox/firefox.git".insteadOf \
            "git@github.com:mozilla-firefox/firefox.git"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0

      - name: Download built DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: glide.macos-${{ matrix.arch }}.dmg
          path: dist
          run-id: ${{ env.ARTIFACTS_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Rename DMG
        run: |
          mv dist/*.dmg dist/glide.dmg

      - name: Download MAR tool
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-${{ matrix.arch }}-mar-tool
          path: dist/mar-tool
          run-id: ${{ env.ARTIFACTS_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download update manifests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-${{ matrix.arch }}-updates
          path: dist/updates
          run-id: ${{ env.ARTIFACTS_RUN_ID }}
          github-token: ${{ github.token }}

      # not used by the sign job, only to check that the previous release can update to this build
      - name: Download unsigned MAR
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-${{ matrix.arch }}.mar
          path: dist/unsigned-mar
          run-id: ${{ env.ARTIFACTS_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Install system dependencies
        run: |
          brew update
          brew install cairo gnu-tar mercurial xz
          sudo pip install setuptools

          brew uninstall --ignore-dependencies python3.12 -f

          export PATH="$(python3 -m site --user-base)/bin":$PATH
          python3 -m pip install --user mercurial

          rm '/usr/local/bin/2to3-3.11' '/usr/local/bin/2to3-3.12' '/usr/local/bin/2to3'
          rm '/usr/local/bin/idle3.11' '/usr/local/bin/idle3.12' '/usr/local/bin/idle3'
          rm '/usr/local/bin/pydoc3.11' '/usr/local/bin/pydoc3.12' '/usr/local/bin/pydoc3'
          rm '/usr/local/bin/python3.11' '/usr/local/bin/python3.12' '/usr/local/bin/python3'
          rm '/usr/local/bin/python3.11-config' '/usr/local/bin/python3.12-config' '/usr/local/bin/python3-config'

          brew install watchman cargo-binstall

      - name: Install apple-codesign
        run: |
          cargo binstall -y apple-codesign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Force usage of gnu-tar
        run: |
          echo 'export PATH="/usr/local/opt/gnu-tar/libexec/gnubin:$PATH"' >> ~/.bash_profile
          echo 'export PATH="/usr/local/opt/gnu-tar/libexec/gnubin:$PATH"' >> ~/.zsh
          source ~/.bash_profile

      - name: Bootstrap repo
        run: |
          pnpm bootstrap

          cd engine
          export GLIDE_PLATFORM="macos"
          export PATH="$(python3 -m site --user-base)/bin":$PATH
          ./mach --no-interactive bootstrap --application-choice browser --no-system-changes || true
          cd ..

      - name: Rehearse the sign job
        run: |
          python3 .github/scripts/macos-signed-mar-test.py \
            --arch "$GLIDE_COMPAT" \
            --work "$RUNNER_TEMP/signed-mar" \
            --build-dmg dist/glide.dmg \
            --mar-tool dist/mar-tool/mar \
            --updates dist/updates \
            --unsigned-mar "dist/unsigned-mar/macos-$GLIDE_COMPAT.mar" \
            --skip "$SKIP"
        env:
          SKIP: ${{ inputs.signed_mar_test_skip }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 7
          name: signed-mar-test-${{ matrix.arch }}
          path: ${{ runner.temp }}/signed-mar/logs
